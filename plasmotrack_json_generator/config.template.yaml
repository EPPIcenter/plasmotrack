# Plasmotrack model input.
#
#   Rscript make_plasmotrack_json.R --config this_file.yaml --dry-run
#   Rscript make_plasmotrack_json.R --config this_file.yaml
#
# Two tables:
#   genetic — one row per allele call (sample, locus, allele, reads)
#   epi     — one row per sample (sample id, a date or a numeric time,
#             symptomatic status). The same file can serve as both if the
#             epi columns are already on the genotype table.
#
# Filters, allele frequencies, and relatedness are all computed inside each
# stratum, so each JSON describes the population actually being modelled.
# strata: [] writes a single file, all.json.

dataset: my_study

genetic:
  path: path/to/allele_calls.tsv
  delim: "\t"          # "," for csv
  columns:
    sample_id: sample_id
    locus: locus
    allele: allele
    reads: reads
  # Optional. Keep only loci whose names match; delete the line to keep all.
  # locus_pattern: "-1A$"
  # If the allele label is only unique within a locus (a PseudoCIGAR),
  # delete columns.allele and uncomment this instead. The allele name
  # becomes "<locus>|<value>".
  # allele_from: PseudoCIGAR

epi:
  path: path/to/epi.csv
  delim: ","
  columns:
    sample_id: sample_id

  observation_time:
    # First column that parses wins, so a well-filled date can fall back
    # to a second one. Dates are tried as YYYY-MM-DD, then a few
    # long-form English formats. Years outside 1990 to next year are
    # rejected rather than trusted.
    columns:
      - date_diagnosis
    type: date            # "date" or "numeric"
    origin: min           # times are shifted so the earliest observation
                          # sits at lead_time (default 365) days, which
                          # leaves room for the infection-duration prior

  symptomatic:
    # Every infection presented for care: uncomment constant and delete
    # column / true_values / false_values.
    # constant: true
    column: symptomatic
    true_values: ["1", "true", "TRUE", "yes"]
    # With false_values set, anything else is unknown and the sample is
    # dropped. Delete these lines to treat every other value as asymptomatic.
    false_values: ["0", "false", "FALSE", "no"]

  # Column or columns that split the cohort into separate JSON files.
  # Names are joined with "_". An empty list is one run named "all".
  strata: []
  min_stratum_size: 2
  # drop_strata:
  #   - unknown

  # Optional. Fill a blank epi column from a lookup table. Each entry
  # tries right_keys in order, which covers a field that holds an id in
  # some rows and a name in others.
  # enrich:
  #   - path: path/to/lookup.tsv
  #     delim: "\t"
  #     left_key: facility
  #     right_keys: [facility_id, facility_name]
  #     ignore_case: true
  #     fill:
  #       country: country

filters:
  min_reads_per_allele: 10
  min_allele_proportion: 0.02
  min_allele_contributors: 2
  min_loci_per_sample: 0
  min_samples_per_locus: 0
  # Hard ceiling. The model stores each locus in a 128-bit set.
  max_alleles_per_locus: 128
  # Drop loci with too little variation to inform relatedness.
  # Heterozygosity is COI-corrected. 0 disables the cut.
  min_expected_heterozygosity: 0
  # Keep only the N most heterozygous loci after the cut above.
  # top_n_loci_by_he: 40
  # Per-stratum overrides. Keys you omit keep the values above.
  # by_stratum:
  #   SiteA:
  #     top_n_loci_by_he: 40

relatedness:
  # Pairs at or below this IBD estimate are not candidate parents.
  # If nearly every infection then sits at max_parents, the cap is
  # choosing the parent set and the threshold should go up.
  ibd_threshold: 0.1
  max_parents: 25
  # Floor applied even when nothing clears the threshold. 0 leaves an
  # empty parent set, which the model can only explain as an importation.
  min_parents: 0
  statistic: estimate     # or CI_lower
  nr: 1000
  confint: true
  cache: true
  # cores: 8              # default is detectCores() - 1; Windows uses 1
  # by_stratum:
  #   SiteA:
  #     ibd_threshold: 0.5
  #     max_parents: 10

output:
  dir: processed/my_study
