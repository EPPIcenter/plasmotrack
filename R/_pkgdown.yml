url: https://eppicenter.github.io/plasmotrack/

template:
  bootstrap: 5

# Groups follow doc/r-package.md, "Documentation and example data". A group whose functions
# are still being written has a title and description only; its ticket adds `contents:`.
reference:
- title: Reading an Analysis
  desc: >
    Open the Runs of one input as an Analysis, and list its Runs, Infections, Loci, and
    candidate pairs.
  contents:
  - pt_read
  - pt_close
  - pt_runs
  - pt_infections
  - pt_loci
  - pt_candidates

- title: Raw tables
  desc: >
    Read any Store table as a lazy table over the closed Windows of every Run.
  contents:
  - pt_table

- title: Per-Draw tables
  desc: >
    Lazy tables with one row per Draw per key. Filter them before you collect them.
  contents:
  - pt_edge_draws
  - pt_infection_draws
  - pt_class_draws
  - pt_out_degree_draws
  - pt_coi_draws
  - pt_alleles
  - pt_order_pair_draws

- title: Functionals
  desc: >
    Lazy tables with one value per Draw: a mean over Infections. `pt_interval()` turns any
    per-Draw table into a posterior mean and an interval.
  contents:
  - pt_mean_out_degree
  - pt_mean_p_latent_parent
  - pt_composition
  - pt_multi_source
  - pt_entropy
  - pt_interval

- title: Summaries
  desc: >
    Tibbles pooled over every sampling Draw of every Run. Set `by_run = TRUE` for one row per
    Run.
  contents:
  - pt_infection_summary
  - pt_edge_marginals
  - pt_parent_sets_pooled
  - pt_map_graph
  - pt_map_out_degree
  - pt_out_degree_range
  - pt_co_inclusion
  - pt_coi
  - pt_genotype_presence
  - pt_genotype_mode
  - pt_infection_times
  - pt_order_pairs

- title: Out-degree posteriors
  desc: >
    The posterior of an Infection's out-degree, and of the realized mean out-degree, with the
    variance within Draws included.
  contents:
  - pt_out_degree_dist
  - pt_realized_out_degree
  - pt_sample_networks

- title: Strata and flows
  desc: >
    Transmission between epi strata: attribution, enrichment, net flow, and long-lag
    reassignment. The Functionals and out-degree summaries take `by =` for strata too.

- title: Convergence
  desc: >
    Compare the Runs of an Analysis: R-hat and ESS on every quantity, Spread, and Disputed
    Infections.

- title: Sampler Blocks
  desc: >
    Acceptance counts and replica-exchange swaps, summed over Windows.
  contents:
  - pt_acceptance
  - pt_swaps

- title: Truth and scoring
  desc: >
    Read a simulation's truth and score an Analysis against it.
  contents:
  - pt_read_truth
  - pt_score_edges
  - pt_score_pairs
  - pt_score_parent_sets
  - pt_score_map
  - pt_score_genotypes
  - pt_score_coi

- subtitle: Fit summary
  desc: >
    One row per fit with every score and Functional, ready to bind across simulations.

- title: Plots
  desc: >
    ggplot2 plots of per-Draw tables, intervals, and convergence.

- title: Export
  desc: >
    Export the network as an igraph or tidygraph graph.
  contents:
  - pt_as_igraph
  - pt_as_tbl_graph
